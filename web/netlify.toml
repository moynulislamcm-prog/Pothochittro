# Netlify কনফিগ — web/ ডিরেক্টরির জন্য
#
# Netlify UI-তে Site configuration → Base directory = "web" দিয়ে থাকলে
# Netlify এই ফাইলটি পড়বে (রুটের netlify.toml নয়)।
# এখানে publish পাথ base-এর সাপেক্ষে, তাই "dist" মানে web/dist।

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# একক-পেজ অ্যাপ (SPA): সার্ভারে /districts বা /admin নামে কোনো ফাইল নেই,
# তাই সব অনুরোধ index.html এ পাঠানো হয় — নইলে রিফ্রেশে 404 আসে।
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
